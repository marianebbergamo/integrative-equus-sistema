<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu lateral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Menu principal" style="font-family:'Hanken Grotesk',system-ui,sans-serif;color:#FFFFFF;background:#7B2234;box-sizing:border-box;padding:24px 14px;display:flex;flex-direction:column;gap:22px">
<a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none;color:#FFFFFF">
<img src="assets/simbolo-branco.png" alt="" style="height:40px;width:auto">
<span style="display:flex;flex-direction:column;gap:2px">
<span style="font-family:'Spectral',Georgia,serif;font-size:19px;line-height:1">Integrative Equus</span>
<span style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#D9DBDD">Medicina equina</span>
</span>
</a>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
<div style="display:flex;flex-direction:column;gap:2px">
<sc-if value="{{ g.label }}" hint-placeholder-val="{{ true }}">
<div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#D9DBDD;padding:0 10px 6px">{{ g.label }}</div>
</sc-if>
<sc-for list="{{ g.items }}" as="item" hint-placeholder-count="3">
<a href="{{ item.href }}" style="display:flex;align-items:center;gap:12px;min-height:40px;padding:0 10px;border-radius:8px;text-decoration:none;color:#FFFFFF;font-size:15px;background:{{ item.bg }};font-weight:{{ item.fw }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ item.d }}"></path></svg>
<span>{{ item.label }}</span>
</a>
</sc-for>
</div>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","fluxo","agenda","clientes","animais","haras","propostas","fichas","financeiro","nf","servicos","produtos","estoque"],"default":"inicio"},"$preview":{"width":248,"height":780}}'>

const active = this.props.active ?? 'inicio';
const raw = [

return { groups };
}
}
</script>
</body>
</html>
